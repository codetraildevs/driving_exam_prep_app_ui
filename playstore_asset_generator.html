<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rwanda Traffic Rule - Pro Store Designer</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Montserrat:wght@400;700;900&family=Poppins:wght@400;700;900&family=Roboto:wght@400;700;900&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --primary-bg: linear-gradient(135deg, #1a237e 0%, #0d47a1 50%, #01579b 100%);
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: #f4f7f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            color: #2c3e50;
        }

        h1 {
            margin-bottom: 20px;
            font-weight: 900;
            letter-spacing: -1px;
        }

        .dashboard {
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 1000px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        .control-item {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 10px;
            font-weight: 700;
            color: #7f8c8d;
            text-transform: uppercase;
        }

        input,
        select,
        button {
            padding: 10px;
            border: 1px solid #dfe6e9;
            border-radius: 8px;
            font-size: 13px;
            outline: none;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #1a237e;
            color: white;
            border: none;
            font-weight: 700;
            cursor: pointer;
            grid-column: span 4;
            padding: 15px;
            font-size: 16px;
            margin-top: 10px;
        }

        .btn-primary:hover {
            background: #0d1a6e;
            transform: translateY(-1px);
        }

        /* Preview Display */
        .preview-outer {
            display: flex;
            justify-content: center;
            width: 100%;
            margin-bottom: 40px;
        }

        .preview-wrapper {
            position: relative;
            background: #ddd;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }

        /* Layout Modes */
        .mode-portrait .preview-wrapper {
            width: 340px;
            height: 604px;
        }

        .mode-landscape .preview-wrapper {
            width: 640px;
            height: 360px;
        }

        .mode-feature .preview-wrapper {
            width: 716px;
            height: 350px;
        }

        .mode-icon .preview-wrapper {
            width: 350px;
            height: 350px;
        }

        #virtualCanvas {
            width: 100%;
            height: 100%;
            background: var(--primary-bg);
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
            overflow: hidden;
        }

        /* Header Previews */
        .header-preview {
            color: white;
            font-weight: 900;
            text-align: center;
            line-height: 1.1;
            z-index: 5;
        }

        .mode-portrait .header-preview {
            font-size: 28px;
            padding: 40px 20px;
        }

        .mode-landscape .header-preview {
            font-size: 32px;
            padding: 25px 40px;
        }

        .mode-feature .header-preview {
            font-size: 38px;
            text-align: left;
            max-width: 500px;
            padding: 40px;
            padding-bottom: 0;
            align-self: flex-start;
            margin-top: 40px;
        }

        .subtitle-preview {
            color: rgba(255, 255, 255, 0.8);
            font-weight: 400;
            font-size: 18px;
            text-align: left;
            max-width: 450px;
            padding: 0 40px;
            z-index: 5;
            display: none;
        }

        .mode-feature .subtitle-preview {
            display: block;
        }

        /* Decorative Blobs */
        .blob {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            filter: blur(40px);
            z-index: 1;
        }

        .blob-1 { width: 300px; height: 300px; top: -100px; left: -100px; }
        .blob-2 { width: 400px; height: 400px; bottom: -150px; right: -50px; }

        /* Branding Badge */
        .brand-badge {
            position: absolute;
            top: 20px;
            right: 20px;
            background: white;
            color: #1a237e;
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: 900;
            font-size: 14px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            z-index: 10;
            display: none;
        }

        .mode-feature .brand-badge {
            display: block;
        }

        /* Mockup Containers */
        .mockup-container {
            position: relative;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d;
        }

        /* Portrait Phone */
        .mode-portrait .mockup-container {
            width: 220px;
            height: 440px;
        }

        .mode-portrait .mockup-frame {
            border-radius: 28px;
            border-width: 3px;
        }

        /* Landscape Tablet (16:10 standard) */
        .mode-landscape .mockup-container {
            width: 448px;
            height: 280px;
            margin-top: 10px;
        }

        .mode-landscape .mockup-frame {
            border-radius: 12px;
            border-width: 6px;
            padding: 4px;
        }

        /* Feature Graphic Banner */
        .mode-feature .mockup-container {
            width: 180px;
            height: 360px;
            transform: rotateY(-25deg) rotateX(10deg);
            margin-right: 40px;
            margin-top: auto;
            margin-bottom: auto;
        }

        .mockup-frame {
            width: 100%;
            height: 100%;
            background: #111;
            box-sizing: border-box;
            border-style: solid;
            border-color: #333;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
            display: flex;
        }

        .screen-area {
            width: 100%;
            height: 100%;
            background: #050505;
            border-radius: inherit;
            overflow: hidden;
            position: relative;
        }

        .screen-area img {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            transition: none;
        }

        /* Perspective Angles */
        .angle-left .mockup-container {
            transform: rotateY(-20deg) rotateX(10deg);
        }

        .angle-right .mockup-container {
            transform: rotateY(20deg) rotateX(10deg);
        }

        .angle-tilted .mockup-container {
            transform: rotateZ(-5deg) translateY(20px);
        }

        /* Icon View */
        #iconPreview {
            display: none;
            width: 220px;
            height: 220px;
            border-radius: 45px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            margin-top: 65px;
        }

        .mode-icon #iconPreview {
            display: block;
        }

        .mode-icon .mockup-container {
            display: none;
        }

        #exportCanvas {
            display: none;
        }

        .hint {
            margin-top: 20px;
            color: #7f8c8d;
            font-size: 13px;
            text-align: center;
        }
    </style>
</head>

<body class="mode-portrait">

    <h1>Pro Play Store Designer</h1>

    <div class="dashboard">
        <div class="control-item">
            <label>Asset Type</label>
            <select id="typeSelect" onchange="updateMode()">
                <option value="portrait">Phone Screenshot (1080x1920)</option>
                <option value="landscape">Tablet Screenshot (1920x1080)</option>
                <option value="feature">Feature Graphic (1024x500)</option>
                <option value="icon">App Icon (512x512)</option>
            </select>
        </div>
        <div class="control-item" style="grid-column: span 2;">
            <label>Marketing Text</label>
            <input type="text" id="headerInput" value="RWANDA'S MOST TRUSTED TRAFFIC APP" oninput="drawPreview()">
        </div>
        <div class="control-item" style="grid-column: span 2;">
            <label>Subtitle Text (Feature Only)</label>
            <input type="text" id="subtitleInput" value="Master Driving Rules & Pass Your Exams with Confidence" oninput="drawPreview()">
        </div>
        <div class="control-item">
            <label>Screenshot Upload</label>
            <input type="file" id="fileInput" accept="image/*" onchange="handleImage(event)">
        </div>

        <div class="control-item">
            <label>Text Size</label>
            <input type="range" id="sizeInput" min="10" max="80" value="28" oninput="drawPreview()">
        </div>
        <div class="control-item">
            <label>Content Zoom</label>
            <input type="range" id="zoomInput" min="5" max="200" value="100" oninput="drawPreview()">
        </div>
        <div class="control-item">
            <label>Vertical Position</label>
            <input type="range" id="offsetYInput" min="-500" max="500" value="0" oninput="drawPreview()">
        </div>
        <div class="control-item">
            <label>Theme Color</label>
            <select id="themeSelect" onchange="drawPreview()">
                <option value="#1a237e,#01579b">Premium Blue</option>
                <option value="#4a148c,#9c27b0">Creative Purple</option>
                <option value="#004d40,#009688">Safety Teal</option>
                <option value="#212121,#424242">Dark Mode Sleek</option>
                <option value="#b71c1c,#ef5350">Urgent Red</option>
            </select>
        </div>
        <div class="control-item">
            <label>Font Family</label>
            <select id="fontSelect" onchange="drawPreview()">
                <option value="'Inter', sans-serif">Inter</option>
                <option value="'Montserrat', sans-serif">Montserrat</option>
                <option value="'Poppins', sans-serif">Poppins</option>
                <option value="'Roboto', sans-serif">Roboto</option>
            </select>
        </div>
        <div class="control-item">
            <label>Perspective</label>
            <select id="angleSelect" onchange="updatePerspective()">
                <option value="angle-none">Straight</option>
                <option value="angle-left">Oblique Left</option>
                <option value="angle-right">Oblique Right</option>
                <option value="angle-tilted">Angle Tilt</option>
            </select>
        </div>
        <button class="btn-primary" onclick="generateAndDownload()">DOWNLOAD PRODUCTION ASSET (PNG)</button>
    </div>

    <div class="preview-outer">
        <div class="preview-wrapper">
            <div id="virtualCanvas" class="angle-none" style="background: linear-gradient(135deg, #1a237e, #01579b);">
                <div class="blob blob-1"></div>
                <div class="blob blob-2"></div>
                <div class="brand-badge">TRAFFIC RULE RWANDA</div>
                <div class="header-preview" id="headerDisplay">RWANDA'S MOST TRUSTED TRAFFIC APP</div>
                <div class="subtitle-preview" id="subtitleDisplay">Master Driving Rules & Pass Your Exams with Confidence</div>

                <div id="iconPreview">
                    <img id="iconImg" src="" style="display:none;">
                    <div id="iconPlaceholder"
                        style="background:#fff; height:100%; display:flex; align-items:center; justify-content:center; color:#333; font-weight:bold; font-size:12px;">
                        App Logo</div>
                </div>

                <div class="mockup-container">
                    <div class="mockup-frame">
                        <div class="screen-area">
                            <img id="screenImg" src="" style="display:none;">
                            <div id="screenPlaceholder"
                                style="height:100%; display:flex; align-items:center; justify-content:center; color:#555; text-align:center; padding:20px; font-size:12px;">
                                Screenshot</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="hint">Adjust <b>Content Zoom</b> and <b>Vertical Position</b> to fit your screenshot perfectly.</div>
    <canvas id="exportCanvas"></canvas>

    <script>
        let uploadedImg = null;

        function updateMode() {
            const mode = document.getElementById('typeSelect').value;
            document.body.className = `mode-${mode}`;
            if (mode === 'icon') document.getElementById('headerInput').disabled = true;
            else document.getElementById('headerInput').disabled = false;

            // Default fits
            document.getElementById('zoomInput').value = 100;
            document.getElementById('offsetYInput').value = 0;

            drawPreview();
        }

        function handleImage(e) {
            const reader = new FileReader();
            reader.onload = function (event) {
                uploadedImg = new Image();
                uploadedImg.onload = function () {
                    document.getElementById('screenImg').src = uploadedImg.src;
                    document.getElementById('screenImg').style.display = 'block';
                    document.getElementById('screenPlaceholder').style.display = 'none';
                    document.getElementById('iconImg').src = uploadedImg.src;
                    document.getElementById('iconImg').style.display = 'block';
                    document.getElementById('iconPlaceholder').style.display = 'none';
                    drawPreview();
                };
                uploadedImg.src = event.target.result;
            }
            reader.readAsDataURL(e.target.files[0]);
        }

        function updatePerspective() {
            document.getElementById('virtualCanvas').className = document.getElementById('angleSelect').value;
        }

        function drawPreview() {
            const mode = document.getElementById('typeSelect').value;
            const text = document.getElementById('headerInput').value;
            const size = document.getElementById('sizeInput').value;
            const zoom = document.getElementById('zoomInput').value / 100;
            const offsetY = document.getElementById('offsetYInput').value;
            const font = document.getElementById('fontSelect').value;
            const theme = document.getElementById('themeSelect').value.split(',');

            const header = document.getElementById('headerDisplay');
            header.innerText = text;
            header.style.fontSize = size + 'px';
            header.style.fontFamily = font;

            const subtitle = document.getElementById('subtitleDisplay');
            subtitle.innerText = document.getElementById('subtitleInput').value;
            subtitle.style.fontFamily = font;

            const img = document.getElementById('screenImg');
            if (uploadedImg) {
                // UI Scale factor
                const containerW = mode === 'landscape' ? 448 : (mode === 'feature' ? 220 : 220);
                const containerH = mode === 'landscape' ? 280 : (mode === 'feature' ? 440 : 440);

                // For screenshots, we want to see the WHOLE screen inside the frame by default (Math.min)
                const baseScale = Math.min(containerW / uploadedImg.width, containerH / uploadedImg.height);
                img.style.width = (uploadedImg.width * baseScale * zoom) + 'px';
                img.style.height = 'auto';
                img.style.top = `calc(50% + ${offsetY / 4}px)`;
            }

            // Update badge color
            document.querySelector('.brand-badge').style.color = theme[0];

            document.getElementById('virtualCanvas').style.background = `linear-gradient(135deg, ${theme[0]}, ${theme[1]})`;
        }

        function generateAndDownload() {
            const mode = document.getElementById('typeSelect').value;
            const canvas = document.getElementById('exportCanvas');
            const ctx = canvas.getContext('2d');
            const theme = document.getElementById('themeSelect').value.split(',');
            const text = document.getElementById('headerInput').value;
            const size = document.getElementById('sizeInput').value;
            const font = document.getElementById('fontSelect').value;
            const angle = document.getElementById('angleSelect').value;
            const zoom = document.getElementById('zoomInput').value / 100;
            const offsetY = parseInt(document.getElementById('offsetYInput').value);

            let W, H;
            if (mode === 'portrait') { W = 1080; H = 1920; }
            else if (mode === 'landscape') { W = 1920; H = 1080; }
            else if (mode === 'feature') { W = 1024; H = 500; }
            else { W = 512; H = 512; }

            canvas.width = W; canvas.height = H;

            // 1. Background
            const grad = ctx.createLinearGradient(0, 0, W, H);
            grad.addColorStop(0, theme[0]); grad.addColorStop(1, theme[1]);
            ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H);

            // 2. Content
            const fs = Math.round(size / 0.3);
            ctx.fillStyle = "white"; ctx.font = `900 ${fs}px ${font}`;

            if (mode === 'portrait') {
                ctx.textAlign = "center"; wrapText(ctx, text.toUpperCase(), W / 2, H * 0.15, W * 0.9, fs * 1.1);
                drawMockup(ctx, W / 2, H * 0.62, 800, 1500, 80, angle, uploadedImg, zoom, offsetY);
            } else if (mode === 'landscape') {
                ctx.textAlign = "center"; wrapText(ctx, text.toUpperCase(), W / 2, H * 0.18, W * 0.9, fs * 1.1);
                drawMockup(ctx, W / 2, H * 0.62, 1400, 875, 50, angle, uploadedImg, zoom, offsetY);
            } else if (mode === 'feature') {
                // 1a. Background Decorative Blobs
                ctx.fillStyle = "rgba(255, 255, 255, 0.15)";
                ctx.beginPath(); ctx.arc(0, 0, 300, 0, Math.PI * 2); ctx.fill(); 
                ctx.beginPath(); ctx.arc(W, H, 400, 0, Math.PI * 2); ctx.fill();

                // 2a. Branding Badge
                ctx.fillStyle = "white";
                roundRect(ctx, W - 250, 40, 210, 40, 20, true, false);
                ctx.fillStyle = theme[0];
                ctx.font = `bold 16px ${font}`;
                ctx.textAlign = "center";
                ctx.fillText("TRAFFIC RULE RWANDA", W - 145, 67);

                // 2b. Main Content
                ctx.textAlign = "left";
                ctx.fillStyle = "white";
                ctx.font = `900 ${fs}px ${font}`;
                wrapText(ctx, text.toUpperCase(), 60, 160, 550, fs * 1.1);
                
                // 2c. Subtitle
                const subText = document.getElementById('subtitleInput').value;
                ctx.font = `400 ${fs * 0.45}px ${font}`;
                ctx.fillStyle = "rgba(255, 255, 255, 0.85)";
                wrapText(ctx, subText, 60, 320, 500, fs * 0.6);

                // 2d. Mockup with Glow & Shadow
                ctx.save();
                ctx.shadowColor = "rgba(0,0,0,0.4)";
                ctx.shadowBlur = 50;
                ctx.shadowOffsetX = 20;
                ctx.shadowOffsetY = 20;
                drawMockup(ctx, 800, 280, 350, 700, 60, 'angle-right', uploadedImg, zoom, offsetY);
                ctx.restore();
            } else if (mode === 'icon') {
                if (uploadedImg) {
                    const iconSize = 400;
                    ctx.save(); ctx.beginPath(); roundRect(ctx, W / 2 - iconSize / 2, H / 2 - iconSize / 2, iconSize, iconSize, 60, false, false);
                    ctx.clip(); ctx.drawImage(uploadedImg, W / 2 - iconSize / 2, H / 2 - iconSize / 2, iconSize, iconSize); ctx.restore();
                }
            }

            const dl = document.createElement('a');
            dl.download = `traffic_rule_${mode}_${Date.now()}.png`;
            canvas.toBlob((blob) => {
                const url = URL.createObjectURL(blob);
                dl.href = url; dl.click();
            });
        }

        function drawMockup(ctx, x, y, w, h, r, angle, img, zoom, offset) {
            ctx.save(); ctx.translate(x, y);
            if (angle === 'angle-tilted') ctx.rotate(-5 * Math.PI / 180);
            if (angle === 'angle-left') ctx.transform(1, 0, 0.1, 1, 0, 0);
            if (angle === 'angle-right') ctx.transform(1, 0, -0.1, 1, 0, 0);
            ctx.fillStyle = "#111"; roundRect(ctx, -w / 2, -h / 2, w, h, r, true, true);
            ctx.strokeStyle = "#444"; ctx.lineWidth = 14; ctx.stroke();
            if (img) {
                ctx.save(); ctx.beginPath(); roundRect(ctx, -w / 2 + 24, -h / 2 + 24, w - 48, h - 48, r - 10, false, false); ctx.clip();
                // Default fit strategy: Math.min (keep entire screen visible)
                const baseScale = Math.min((w - 48) / img.width, (h - 48) / img.height);
                const finalScale = baseScale * zoom;
                ctx.drawImage(img, -(img.width * finalScale) / 2, -(img.height * finalScale) / 2 + offset, img.width * finalScale, img.height * finalScale);
                ctx.restore();
            }
            ctx.restore();
        }

        function wrapText(ctx, text, x, y, maxW, lineH) {
            const words = text.split(' '); let line = '';
            for (let i = 0; i < words.length; i++) {
                if (ctx.measureText(line + words[i]).width > maxW) { ctx.fillText(line.trim(), x, y); line = words[i] + ' '; y += lineH; }
                else { line += words[i] + ' '; }
            }
            ctx.fillText(line.trim(), x, y);
        }

        function roundRect(ctx, x, y, w, h, r, f, s) {
            ctx.beginPath(); ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
            ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h); ctx.lineTo(x + r, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - r); ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath(); if (f) ctx.fill(); if (s) ctx.stroke();
        }
    </script>
</body>

</html>
