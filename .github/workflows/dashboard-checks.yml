name: Dashboard checks
on:
  push:
    branches: [feat/app-updates-1.2.0]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'backend/src/handlers/access_codes.php'
      - 'backend/src/handlers/pricing.php'
      - '.github/workflows/dashboard-checks.yml'
permissions:
  contents: read
jobs:
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter gen-l10n
      - run: flutter analyze lib/ test/home_page_test.dart test/dashboard_notices_test.dart test/payment_preparation_test.dart test/subscription_payment_page_test.dart --no-fatal-infos --no-fatal-warnings
      - run: flutter test test/home_page_test.dart test/dashboard_notices_test.dart test/payment_preparation_test.dart test/subscription_payment_page_test.dart
      - run: php -l backend/src/handlers/access_codes.php
      - run: php -l backend/src/handlers/pricing.php
