  <script>
    // Keep the browser chrome color in sync with the OS color scheme until
    // Flutter boots (the app overrides it when the user picks a theme).
    function rtrSyncSystemThemeColor() {
      var dark = window.matchMedia &&
        window.matchMedia('(prefers-color-scheme: dark)').matches;
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', dark ? '#0F0F23' : '#00039E');
    }
    rtrSyncSystemThemeColor();
    if (window.matchMedia) {
      window.matchMedia('(prefers-color-scheme: dark)')
        .addEventListener('change', rtrSyncSystemThemeColor);
    }
  </script>



  <style>
    /* ── Loading splash – shown until Flutter engine boots ── */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #00039E;
      overflow: hidden;
    }

    #loading-splash {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #00039E 0%, #3B82F6 100%);
      z-index: 9999;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    #loading-splash.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .splash-icon {
      width: 80px;
      height: 80px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      animation: pulse 1.5s ease-in-out infinite;
    }

    .splash-icon svg {
      width: 44px;
      height: 44px;
      fill: white;
    }

    .splash-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 22px;
      font-weight: 700;
      color: white;
      margin: 0 0 8px 0;
      letter-spacing: -0.3px;
    }

    .splash-subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.75);
      margin: 0;
    }

    .splash-spinner {
      margin-top: 40px;
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255, 255, 255, 0.2);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
  </style>
</head>
<body>
  <!-- Loading splash screen -->
  <div id="loading-splash">
    <div class="splash-icon">
      <!-- Traffic sign / steering wheel icon -->
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
      </svg>
    </div>
    <p class="splash-title">Rwanda Traffic Rule</p>
    <p class="splash-subtitle">Driving Licence Practice Tests</p>
    <div class="splash-spinner"></div>
  </div>

  <!-- Flutter bootstrap -->
  <!-- flutter_bootstrap must NOT be async — the engine needs to find
       its own script element in the DOM during initialization, otherwise
       it throws "Cannot read properties of null (reading 'removeChild')". -->
  <script src="flutter_bootstrap.js"></script>

  <script>
    // Hide splash once Flutter takes over
    window.addEventListener('load', function() {
      // Remove splash after Flutter renders its first frame
      const splash = document.getElementById('loading-splash');
      if (splash) {
        // Poll for Flutter's canvas element
        const checkFlutter = setInterval(function() {
          const canvas = document.querySelector('flt-glass-pane, canvas');
          if (canvas) {
            clearInterval(checkFlutter);
            splash.classList.add('fade-out');
            setTimeout(function() { splash.style.display = 'none'; }, 500);
          }
        }, 200);
        // Fallback: hide splash after 10s regardless
        setTimeout(function() {
          clearInterval(checkFlutter);
          splash.classList.add('fade-out');
          setTimeout(function() { splash.style.display = 'none'; }, 500);
        }, 10000);
      }
    });
  </script>
</body>
</html>
