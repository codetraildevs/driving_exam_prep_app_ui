org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
kotlin.incremental=false
kotlin.incremental.js=false
# Enable R8 full mode for better code shrinking and optimization
android.enableR8.fullMode=true
# Legacy Kotlin mode until all plugins support AGP 9 built-in Kotlin.
android.builtInKotlin=false
# Legacy AGP DSL until Flutter Gradle plugin fully migrates to the new DSL.
android.newDsl=false
