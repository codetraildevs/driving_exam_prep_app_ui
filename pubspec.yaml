name: driveprep_rwanda
description: Learn Rwanda traffic rules and practice theory questions for the driving licence test.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_bloc: ^9.0.0
  provider: ^6.1.0
  url_launcher: ^6.2.5

  # Navigation
  go_router: ^13.2.0

  # Backend
  # (Supabase removed) Backend is now a REST API (PHP/MySQL)

  # UI & Design
  google_fonts: ^6.1.0

  # Local Storage
  shared_preferences: ^2.2.0

  # HTTP
  http: ^1.1.0

  # Date & Time
  intl: ^0.20.2

  # Icons
  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/
    - assets/exams/
    - assets/icons/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-SemiBold.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
  # Make sure the above font files exist in assets/fonts/ and are included in your repository.
  # If you use google_fonts and set allowRuntimeFetching to false, these files must be present.
