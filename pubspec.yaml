name: traffic_rules_app
description: Master Traffic Rules. Pass With Confidence.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^9.0.0

  # Navigation
  go_router: ^13.2.0

  # Backend
  supabase_flutter: ^2.0.0

  # UI & Design
  google_fonts: ^6.1.0
  flutter_animate: ^4.2.0
  lottie: ^3.0.0

  # Charts & Data Visualization
  fl_chart: ^0.68.0

  # Image Handling
  cached_network_image: ^3.3.0

  # Local Storage
  shared_preferences: ^2.2.0

  # Authentication
  google_sign_in: ^6.2.0

  # HTTP
  http: ^1.1.0

  # Date & Time
  intl: ^0.19.0

  # Icons
  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_linter: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
