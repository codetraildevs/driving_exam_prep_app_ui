name: traffic_rules_app
description: Master Traffic Rules. Pass With Confidence.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_bloc: ^9.0.0
  provider: ^6.1.0
  url_launcher: ^6.2.5

  # Navigation
  go_router: ^13.2.0

  # Backend
  # (Supabase removed) Backend is now a REST API (PHP/MySQL)

  # UI & Design
  google_fonts: ^6.1.0
  flutter_animate: ^4.2.0
  lottie: ^3.0.0

  # Charts & Data Visualization
  fl_chart: ^0.68.0

  # Image Handling
  cached_network_image: ^3.3.0

  # Local Storage
  shared_preferences: ^2.2.0
  device_info_plus: ^11.2.1

  # Authentication
  google_sign_in: ^6.2.0

  # HTTP
  http: ^1.1.0

  # Date & Time
  intl: ^0.20.2

  # Icons
  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/
    - assets/exams/
  # Local fonts removed; using `google_fonts` package instead.
