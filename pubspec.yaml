name: traffic_rule_in_rwanda
description: Learn Rwanda traffic rules and practice theory questions for the driving licence test.
publish_to: 'none'

version: 1.1.8+15

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_bloc: ^9.0.0
  flutter_riverpod: ^2.6.1
  url_launcher: ^6.2.5
  
  share_plus: ^13.2.0
  package_info_plus: ^10.2.0

  # Navigation
  go_router: ^13.2.0

  # UI & Design
  google_fonts: ^6.1.0

  # Local Storage
  shared_preferences: ^2.2.0

  # HTTP
  dio: ^5.4.0

  # Date & Time
  intl: ^0.20.2

  # Icons
  cupertino_icons: ^1.0.2

  # Security
  screen_protector: ^1.5.3

  # Code Generation
  json_annotation: ^4.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.14.3
  json_serializable: ^6.8.0
  build_runner: ^2.4.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21 # android min sdk min:16, default:21

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/
    - assets/exams/
    - assets/icons/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-SemiBold.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
